services:
  # FastAPI AI Recognition Backend Service
  - type: web
    name: ai-attendance-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://ai--based-smart-attendance.web.app,https://ai--based-smart-attendance.firebaseapp.com,http://localhost:3000"
      - key: FACE_MATCH_THRESHOLD
        value: "0.65"
      - key: MIN_MATCH_MARGIN
        value: "0.08"
      - key: REQUIRED_CONSECUTIVE_MATCHES
        value: "2"
